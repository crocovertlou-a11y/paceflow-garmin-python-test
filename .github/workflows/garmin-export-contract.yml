
name: Garmin export contract (offline)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin Connect
        run: |
          python -m pip install "garminconnect==0.3.19"

      - name: Inspect Garmin export contract
        run: |
          python .github/workflows/check_garmin_export_contract.py
