
name: Garmin session API compatibility (no credentials)

on:
  workflow_dispatch:
  push:
    paths:
      - 'check_garmin_session_api.py'
      - '.github/workflows/garmin-session-compatibility.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Garmin client range
        run: python -m pip install 'garminconnect>=0.3.17,<0.4' 'curl_cffi'
      - name: Inspect public Python API without credentials
        run: python check_garmin_session_api.py

